{% extends 'base.html' %}

{% block content %}
<div class="card card-md">
  <div class="card-body">
    <h2 class="h2 text-center mb-4">{{ _('Login') }}</h2>
    <form action="{{ url_for('login') }}" method="POST" autocomplete="off">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <input type="hidden" id="redirect" name="redirect" value="{{ redirect_url }}">
        <input type="hidden" id="email" name="email" value="defaultuser@changedetection.io">
        <div class="mb-3">
            <label class="form-label" for="password">{{ _('Password') }}</label>
            <input class="form-control" type="password" id="password" name="password" required autofocus>
        </div>
        <button type="submit" class="btn btn-primary w-100">{{ _('Login') }}</button>
    </form>
  </div>
</div>
{% endblock %}
